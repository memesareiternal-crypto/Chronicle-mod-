name: Forge remake build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build production jar
        run: bash ./gradlew --no-daemon build
      - name: Minecraft regression tests
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon runGameTestServer | tee gametest-output.log
          grep -Eq 'All [1-9][0-9]* required tests passed' gametest-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicle-forge-1.20.1
          path: |
            build/libs/*.jar
            gametest-output.log
          if-no-files-found: error
